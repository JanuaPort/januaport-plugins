name: jnpt-plugin-bing-webmaster
services:
  bing-webmaster:
    image: ${JNPT_BING_WEBMASTER_IMAGE:?image digest required}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    ipc: none
    tmpfs:
      - /tmp:size=2m,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700
    environment:
      BING_WEBMASTER_BIND_IP: ${BING_WEBMASTER_PLUGIN_IP:?exact internal network address required}
    volumes:
      - type: bind
        source: /opt/jnpt/plugins/bing-webmaster/config.json
        target: /etc/bing-webmaster/config.json
        read_only: true
        bind: {create_host_path: false}
      # Zwei ORDNER-Mounts statt Datei-Mounts (Muster #887): ein atomar ersetzter
      # Schlüssel kommt an, und die Stellen entstehen im Gateway aus den Ordnern.
      # jnpt/runtime-key = der EINE Bridge-Key (Stelle plugin-bing-webmaster),
      # bing/runtime-key = der Bing-API-Schlüssel (Stelle plugin-bing-webmaster-bing).
      # Beide liest der Dienst nur beim Start; den Neustart nach einem
      # Schlüsselwechsel löst deploy/jnpt-bing-webmaster-key.path aus.
      - type: bind
        source: /run/jnpt/plugins/bing-webmaster
        target: /run/secrets/jnpt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/jnpt/plugins/bing-webmaster-bing
        target: /run/secrets/bing
        read_only: true
        bind: {create_host_path: false}
    networks:
      plugins:
        ipv4_address: ${BING_WEBMASTER_PLUGIN_IP:?exact internal network address required}
      egress: {}
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://'+os.environ['BING_WEBMASTER_BIND_IP']+':8092/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
networks:
  plugins:
    external: true
    name: jnpt_plugins
  # Dedicated network. Host firewall must restrict egress before activation;
  # Compose does not enforce domain allowlists. No other workload joins it.
  egress: {}
