name: linkedin-seite
on:
  push:
    branches: [main]
    paths:
      - 'linkedin-seite/**'
      - '.github/workflows/linkedin-seite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Fixed reports and negative controls (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: linkedin-seite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: linkedin-seite/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python tests/mutations.py
  image:
    name: Private non-root service image (no publish)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t linkedin-seite:ci linkedin-seite
      - name: Unit tests inside non-root read-only image without external network
        run: >-
          docker run --rm --network none --read-only --user 65532:65532
          --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1
          --pids-limit 32 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
          --mount type=bind,src="$PWD/linkedin-seite/tests",dst=/app/tests,readonly
          --entrypoint python linkedin-seite:ci -m unittest discover -s tests -v
