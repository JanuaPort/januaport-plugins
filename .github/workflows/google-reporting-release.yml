# Release des Google-Reporting-Beistellers (JanuaPort/januaport#1138, Vorlage:
# agent-runner-release.yml und script-runner-release.yml).
#
# Auslöser ist ausschließlich der Tag google-reporting-vX.Y.Z, den das Quality
# Gate setzt. Ablauf:
#   unit     Hash-Lock installieren, Unit-Tests und Mutationsproben (Python 3.12)
#   build    EIN Build, nur linux/amd64, mit SBOM und Provenance, per Digest
#            nach GHCR gepusht — ohne Tag
#   probes   zieht genau diesen Digest, vergleicht den Config-Digest des
#            geprüften Images mit dem der amd64-Plattform des gepushten
#            (SEC C1) und fährt die Sonden dagegen: Benutzer 65532, Unit-Tests
#            im gehärteten Container ohne Netz, Start ohne Konfiguration
#            endet fail-closed
#   scan     Trivy-Bericht als Artefakt — kein Gate, entschieden wird im
#            Kuratierungs-Nachweis (google-reporting/CHANGELOG.md)
#   publish  erst nach grünen Sonden: Tag X.Y.Z auf denselben Digest
#
# Warum Sonden gegen den gepushten Digest statt Build → Sonden → zweiter
# Build mit Push: Ein zweiter buildx-Lauf erzeugt nicht zwingend dasselbe
# Image (Zeitstempel in der Config). So ist das geprüfte Image das
# ausgelieferte, und der Vergleich in `probes` belegt es zusätzlich. Ein
# Digest ohne Tag ist kein Angebot: Anlagen beziehen das Image nur über den
# signierten Katalog, und der nennt nur einen kuratierten Digest.
#
# SEC C2: In den Jobs mit packages: write laufen nur actions/* und docker/*.
# Alle Aktionen sind per Commit-SHA gepinnt (Kommentar = Fassung).
name: google-reporting-release

on:
  push:
    tags:
      - "google-reporting-v*"

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/januaport/google-reporting

jobs:
  unit:
    name: Unit-Tests und Mutationsproben (google-reporting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: google-reporting
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google-reporting/requirements.lock
      - name: Tag-Schema google-reporting-vX.Y.Z
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^google-reporting-v[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Abhängigkeiten (Hash-Lock)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v
      - name: Mutationsproben
        run: python tests/mutations.py

  build:
    name: Build und Push per Digest (GHCR, amd64)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build und Push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: google-reporting
          # v1 nur amd64: Die Sonden laufen nur dort.
          platforms: linux/amd64
          # Ohne Tag: getaggt wird erst in publish, nach grünen Sonden.
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.title=google-reporting
            org.opencontainers.image.description=JanuaPort google-reporting (GSC/GA4-Berichte und Verwaltungshandgriffe)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  probes:
    name: Docker-Sonden gegen den gepushten Digest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SEC C1: Das geprüfte Image ist das gepushte. Config-Digest aus dem
      # lokal gezogenen Image (aus `docker save`, unabhängig vom Image-Store
      # des Runners) gegen config.digest der amd64-Plattform im Registry-Index.
      - name: Config-Digest geprüft = gepusht (SEC C1)
        run: |
          set -eu
          ref="${IMAGE_REPO}@${DIGEST}"
          docker pull -q --platform linux/amd64 "$ref"
          amd64=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          [ "$(printf '%s\n' "$amd64" | grep -c .)" = 1 ] || { echo "nicht genau eine amd64-Plattform: $amd64" >&2; exit 1; }
          pushed=$(docker buildx imagetools inspect --raw "${IMAGE_REPO}@${amd64}" | jq -r '.config.digest')
          checked=sha256:$(docker save "$ref" | tar -xOf - manifest.json | jq -r '.[0].Config' | grep -oE '[0-9a-f]{64}')
          echo "docker inspect .Id:  $(docker image inspect -f '{{.Id}}' "$ref")"
          echo "geprüft (Config):    $checked"
          echo "gepusht (amd64):     $pushed"
          [ "$checked" = "$pushed" ] || { echo "Config-Digest weicht ab — Abbruch" >&2; exit 1; }
          # Die Sonden brauchen die Registry nicht mehr; der Testlauf im
          # Container soll kein Token sehen.
          docker logout ghcr.io
      # Die Tests liegen nicht im Image (.dockerignore) und kommen read-only
      # aus dem Checkout. Dieselbe Härtung wie der Image-Job in
      # google-reporting.yml; der Test der Auslieferungsdateien überspringt
      # sich dort, weil Compose und deploy/ nicht eingehängt sind.
      - name: Sonden
        run: |
          set -eu
          ref="${IMAGE_REPO}@${DIGEST}"
          user=$(docker image inspect -f '{{.Config.User}}' "$ref")
          [ "$user" = "65532:65532" ] || { echo "Benutzer ist $user, erwartet 65532:65532" >&2; exit 1; }
          hardened="--network none --read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 32 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532"
          # shellcheck disable=SC2086
          docker run --rm $hardened \
            --mount type=bind,src="$PWD/google-reporting/tests",dst=/app/tests,readonly \
            --entrypoint python "$ref" -m unittest discover -s tests -v
          # Ohne config.json und Schlüssel darf der Dienst nicht anlaufen: fester Code, Exit 1.
          set +e
          # shellcheck disable=SC2086
          out=$(docker run --rm $hardened "$ref" 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] || { echo "Start ohne Konfiguration endete mit $code, erwartet 1" >&2; exit 1; }
          [ "$out" = "startup_failed" ] || { echo "Ausgabe ist nicht genau startup_failed" >&2; exit 1; }
      # Für den Kuratierungs-Nachweis: welcher Lauf hat welchen Digest geprüft.
      - name: Nachweis
        run: |
          {
            echo "### google-reporting ${GITHUB_REF_NAME}"
            echo "- Digest (Index): \`${DIGEST}\`"
            echo "- Sonden grün in Lauf \`${{ github.run_id }}\` (Versuch ${{ github.run_attempt }})"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Trivy-Bericht (kein Gate)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Trivy bekommt eine Datei, kein Registry-Token.
      - name: Image als Datei
        run: |
          docker pull -q --platform linux/amd64 "${IMAGE_REPO}@${DIGEST}"
          docker save -o image.tar "${IMAGE_REPO}@${DIGEST}"
          docker logout ghcr.io
      - name: Trivy installieren
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
      - name: Scan
        run: |
          mkdir -p report
          "$RUNNER_TEMP/trivy" image --input image.tar --scanners vuln --exit-code 0 \
            --format json --output report/trivy.json
          "$RUNNER_TEMP/trivy" convert --format table --output report/trivy.txt report/trivy.json
          echo "${DIGEST}" > report/digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ github.ref_name }}
          path: report/

  publish:
    name: Tag auf den geprüften Digest
    needs: [build, probes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Kein `latest`: Anlagen beziehen per Digest aus dem Katalog.
      - name: Tag setzen und prüfen
        run: |
          set -eu
          version="${GITHUB_REF_NAME#google-reporting-v}"
          docker buildx imagetools create -t "${IMAGE_REPO}:${version}" "${IMAGE_REPO}@${DIGEST}"
          tagged=sha256:$(docker buildx imagetools inspect --raw "${IMAGE_REPO}:${version}" | sha256sum | cut -d' ' -f1)
          echo "Tag ${version} → ${tagged}"
          [ "$tagged" = "$DIGEST" ] || { echo "Tag zeigt nicht auf den geprüften Digest" >&2; exit 1; }
          echo "- Tag \`${version}\` → \`${tagged}\`" >> "$GITHUB_STEP_SUMMARY"
