# Manuelle Client-Abnahme; Showcase-Vorbereitung und Serverbelege durch GATE.
name: desktop-runner-installtest

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Signiertes Desktop-Release (ohne v)'
        required: true
        default: '0.1.0'
        type: string
      url:
        description: 'Anlage im Tailnet (https://<tailnet-name>), Geräte-API ist nicht öffentlich'
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  installtest:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: showcase-installtest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # SEC N1-N3 (#1233): ephemeral Key mit Tag, nur Showcase-Port per ACL,
      # ohne accept-routes, Exit-Node und SSH.
      - name: Tailnet beitreten (kurzlebig)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:installtest
      - name: Signiertes Release im Standardkonto prüfen
        env:
          INSTALLTEST_VERSION: ${{ inputs.version }}
          INSTALLTEST_URL: ${{ inputs.url }}
          SHOWCASE_PAIR_CODE: ${{ secrets.SHOWCASE_PAIR_CODE }}
          GH_TOKEN: ${{ github.token }}
        run: ./desktop-runner/probe/installtest.ps1 -Version $env:INSTALLTEST_VERSION -Url $env:INSTALLTEST_URL -CreateStandardUser
