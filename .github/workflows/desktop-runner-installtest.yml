# Manuelle Client-Abnahme; Showcase-Vorbereitung und Serverbelege durch GATE.
name: desktop-runner-installtest

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Signiertes Desktop-Release (ohne v)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  installtest:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: showcase-installtest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Signiertes Release im Standardkonto prüfen
        env:
          INSTALLTEST_VERSION: ${{ inputs.version }}
          SHOWCASE_PAIR_CODE: ${{ secrets.SHOWCASE_PAIR_CODE }}
          GH_TOKEN: ${{ github.token }}
        run: ./desktop-runner/probe/installtest.ps1 -Version $env:INSTALLTEST_VERSION -CreateStandardUser
