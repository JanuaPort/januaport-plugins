# Tests des Desktop-Läufers (JanuaPort/januaport#1163).
#
# contract: Draht-Vertrag v1 (Goldens, Pakete, signiertes Manifest,
#           Python-Allowlist), go vet, Race-Detector.
# Der Client (D4, #1167) ergänzt hier seine Jobs (Linux-Unit, windows-latest).
name: desktop-runner

on:
  push:
    branches: [main]
    paths:
      - 'desktop-runner/**'
      - '.github/workflows/desktop-runner*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: Test (desktop-runner, Vertrag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-runner/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-runner/contract/go.mod
          cache-dependency-path: desktop-runner/contract/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -race ./...
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: desktop-runner/go.mod
          cache-dependency-path: desktop-runner/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go test -count=1 ./...
        working-directory: desktop-runner/contract
      - run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: desktop-runner/go.mod
          cache-dependency-path: desktop-runner/go.sum
      - name: Kuratierte Laufzeit für echte Startprobe
        run: |
          New-Item -ItemType Directory -Force .probe | Out-Null
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile .probe/python-3.12.10-embed-amd64.zip
          if ((Get-FileHash .probe/python-3.12.10-embed-amd64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3') { throw 'runtime_digest' }
      - run: go vet ./...
      - name: DPAPI, Job Object, echter Python-Start und interrupted
        run: go test -count=1 ./...
      - name: Benutzeraufgabe im echten Standardkonto
        run: ./probe/task-standard-user.ps1
