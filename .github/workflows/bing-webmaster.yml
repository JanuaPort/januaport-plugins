name: bing-webmaster
on:
  push:
    branches: [main]
    paths:
      - 'bing-webmaster/**'
      - '.github/workflows/bing-webmaster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Fixed routes and negative controls (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bing-webmaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bing-webmaster/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python tests/mutations.py
  image:
    name: Private non-root service image (no publish)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bing-webmaster:ci bing-webmaster
      - name: Unit tests inside non-root read-only image without external network
        run: >-
          docker run --rm --network none --read-only --user 65532:65532
          --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1
          --pids-limit 32 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
          --mount type=bind,src="$PWD/bing-webmaster/tests",dst=/app/tests,readonly
          --entrypoint python bing-webmaster:ci -m unittest discover -s tests -v
