# Scannt bei jedem Push und Pull Request die gesamte Historie aller Branches
# (JanuaPort/januaport#787). Das Repository wird öffentlich; ein Geheimnis in
# einem alten Commit ist dann genauso veröffentlicht wie eins im aktuellen Stand.
# gitleaks läuft als Binary mit fester Version und Prüfsumme — die fertige
# GitHub-Action verlangt für Organisationen einen Lizenzschlüssel.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # alle Commits aller Branches, nicht nur der Kopf

      - name: gitleaks installieren
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      - name: Gesamte Historie scannen
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --config .gitleaks.toml --log-opts="--all" .
