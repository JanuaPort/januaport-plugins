# Skript-Läufer (JanuaPort/januaport#928) — Beisteller neben dem Gateway.
#
# Drei dauerhafte Dienste und ein kurzer Init-Dienst aus einem Image:
#   script-runner          vermittler: MCP für das Gateway (nur im internen
#                          Netz jnpt_plugins, Port 8090), kein Host-Port,
#                          Gesundheit über den Docker-Healthcheck (8091)
#   script-runner-sandbox  Wächter + Python: kein Netz, kein Schlüssel, genau
#                          ein Lauf je Instanz, danach Neustart mit leerem tmpfs
#   script-runner-fetcher  abholer: prüft Pins gegen den Standard-Zweig und holt Objekte per ssh, eigenes Netz
#   script-runner-init     legt ready/staging an, beendet sich vor dem Sandbox-Start
#
# Ablage auf der Anlage: /opt/jnpt/plugins/script-runner/ (diese Datei, das
# Seccomp-Profil unter seccomp/ und die .env mit JNPT_SCRIPT_RUNNER_IMAGE).
# Start immer mit -f:
#   docker compose -f /opt/jnpt/plugins/script-runner/docker-compose.yml up -d
#
# Die Ordner unter /run/jnpt/plugins/ legt systemd-tmpfiles an; das Gateway
# schreibt hinein (Beispiel: deploy/jnpt-plugins-script-runner.conf.example).
# Compose-Hygiene: internal/hygiene prüft diese Datei (Vertrag §6, SEC-Zeile 3).
name: jnpt-plugin-script-runner

services:
  script-runner:
    image: ${JNPT_SCRIPT_RUNNER_IMAGE:?JNPT_SCRIPT_RUNNER_IMAGE fehlt in /opt/jnpt/plugins/script-runner/.env}
    command: ["mediator"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    user: "65532:65532"
    environment:
      JNPT_GATEWAY_URL: ${JNPT_GATEWAY_URL:-http://jnpt:8484}
    volumes:
      # runtime-key und pins.json; ein ORDNER-Mount, damit ein atomar
      # ersetzter Schlüssel ankommt.
      - /run/jnpt/plugins/script-runner:/run/jnpt/plugins/script-runner:ro
      - sockets:/run/script-runner
      - store:/var/lib/script-runner
      # Bibliotheksinhalte schreibt nur der vermittler; Init legt Wurzelordner an.
      - libs:/libs
    # Nur das interne Netz der Kern-Compose (JanuaPort/januaport#1069): Weg A
    # (Gateway → script-runner:8090) und Weg B (→ jnpt:8484) laufen darüber,
    # ins Internet und ins LAN gibt es keinen Weg. Kein Host-Port: Aus einem
    # internen Netz wäre er ohnehin nicht erreichbar.
    networks: [plugins]
    # Der Aktuator liest diesen Status (HEALTH_DOCKER=1 im Deskriptor). Kein
    # neuer Code: Python des Images gegen /healthz im Container; 503 oder kein
    # Server heißen Exit ≠ 0.
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Der Deskriptor kennt genau einen SERVICE; `up -d script-runner` startet
    # so auch Sandbox und abholer.
    depends_on: [script-runner-sandbox, script-runner-fetcher]
    restart: unless-stopped

  script-runner-sandbox:
    image: ${JNPT_SCRIPT_RUNNER_IMAGE:?JNPT_SCRIPT_RUNNER_IMAGE fehlt in /opt/jnpt/plugins/script-runner/.env}
    command: ["guard"]
    # Ein subpath-Mount setzt einen vorhandenen Ordner voraus. Auch beim ersten
    # `up -d script-runner` muss Init vollständig erfolgreich beendet sein.
    depends_on:
      script-runner-init:
        condition: service_completed_successfully
    # Vertrag §6, Zeile für Zeile.
    network_mode: none
    read_only: true
    ipc: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp/jnpt-sandbox-seccomp.json
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    user: "65533:65533"
    # Auf Anlagen mit gVisor: runsc-jnpt, ein EIGENER Runtime-Eintrag in
    # daemon.json mit runtimeArgs ["--oci-seccomp", "--host-uds=open"]
    # (deploy/daemon.json.example, Vertrag F3 B1). Ohne --oci-seccomp greift
    # das Profil nicht und der vermittler bedient nicht (S2/B2); ohne
    # --host-uds=open erreicht die Sandbox den Socket nicht.
    runtime: ${JNPT_SCRIPT_RUNNER_RUNTIME:-runc}
    # Genau ein Lauf je Instanz; der Wächter endet danach, Docker startet
    # DENSELBEN Container neu — mit leerem tmpfs (M3).
    restart: always
    tmpfs:
      # mode/uid/gid sind Pflicht: ohne sie legt Docker /work nach einem
      # Neustart als root:755 an, und die Sandbox kann nicht mehr schreiben (G2).
      - /work:size=64m,noexec,nosuid,nodev,uid=65533,gid=65533,mode=0700
      - /tmp:size=16m,noexec,nosuid,nodev,uid=65533,gid=65533,mode=0700
    volumes:
      # Der Socket-Ordner, read-only (M4).
      - sockets:/run/script-runner:ro
      # Der EINE zusätzliche Mount (#1041/#1096): nur fertige Bibliotheken;
      # staging bleibt außerhalb der Mount-Sicht. Beide liegen im selben Volume
      # für einen atomaren Rename. Init legt ready vor diesem Mount an; nocopy
      # verhindert das Kopieren des Image-/libs-Inhalts IN ready.
      # Engine >= 26, Compose >= 2.35.
      # Die entpackten Bibliotheken, nur
      # lesend und ohne noexec (native .so brauchen mmap mit PROT_EXEC). /work
      # und /tmp bleiben noexec; geladen wird per sys.path.append, nie über site.
      - type: volume
        source: libs
        target: /libs
        read_only: true
        volume:
          subpath: ready
          nocopy: true

  script-runner-fetcher:
    image: ${JNPT_SCRIPT_RUNNER_IMAGE:?JNPT_SCRIPT_RUNNER_IMAGE fehlt in /opt/jnpt/plugins/script-runner/.env}
    command: ["fetcher"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    user: "65532:65532"
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700
    volumes:
      # Nur der Deploy-Key, nie pins.json oder der runtime-key (R8).
      - /run/jnpt/plugins/script-runner-git:/run/jnpt/plugins/script-runner-git:ro
      - store:/var/lib/script-runner
    # Eigenes Netz mit Ausgang zum Git-Anbieter; kein Weg zum Gateway.
    networks: [egress]
    restart: unless-stopped

  script-runner-init:
    image: ${JNPT_SCRIPT_RUNNER_IMAGE:?JNPT_SCRIPT_RUNNER_IMAGE fehlt in /opt/jnpt/plugins/script-runner/.env}
    command: ["init-libs"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    volumes:
      # Voller Mount nur zum Initialisieren, kein Socket, Store oder Schlüssel.
      - libs:/libs
    restart: "no"

volumes:
  sockets: {}
  store: {}
  # Entpackte Python-Bibliotheken (#1041): der vermittler schreibt Inhalte,
  # Init legt Wurzelordner an, die Sandbox liest nur. Der volle Init-Mount
  # übernimmt Eigentümer 65532 vom Einhängepunkt /libs im Image.
  libs: {}

networks:
  plugins:
    external: true
    name: jnpt_plugins
    # Das interne Netz legt die Kern-Compose an (internal: true). Fehlt es,
    # bucht der Aktuator (ab Fassung 3) unprovisioned, bevor er etwas zieht.
  egress: {}
