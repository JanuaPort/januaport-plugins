# Test-Überlagerung für die Docker-Sonden (probe/run.sh). NICHT ausliefern.
#
# Ersetzt nur, was auf einem Testrechner nicht existiert: das interne Netz des
# Gateways (<P2_PREFIX>-plugins statt jnpt_plugins, ebenfalls --internal, von
# run.sh angelegt) und die Host-Ordner unter /run/jnpt/plugins (Volumes statt
# tmpfs des Hosts). Alles andere — Härtung, Netzliste, Healthcheck, Sandbox,
# Profil — kommt unverändert aus docker-compose.yml.
services:
  script-runner:
    volumes:
      - probe-keys:/run/jnpt/plugins/script-runner:ro
  script-runner-fetcher:
    volumes:
      - probe-gitkey:/run/jnpt/plugins/script-runner-git:ro

volumes:
  probe-keys: {}
  probe-gitkey: {}

networks:
  plugins:
    external: true
    name: ${P2_PREFIX:-p2-928}-plugins
