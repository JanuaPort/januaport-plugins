# /etc/systemd/system/docker.service.d/10-netz-vor-docker.conf
# Docker erst, wenn Adresse, Route und DNS wirklich da sind (jnpt-netz-warten).
# network-online.target reicht bei DHCP nicht: Caddy bindet an die LAN-Adresse, Gateway und
# Tunnel brauchen einen Nameserver — fehlt beides beim Boot, ist die Box von aussen tot.
# /etc/default/jnpt-netz traegt die LAN-Buchse (JNPT_LAN_IFACE), geschrieben von hardening.sh 7/7.
[Service]
EnvironmentFile=-/etc/default/jnpt-netz
ExecStartPre=/usr/local/sbin/jnpt-netz-warten
